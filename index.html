<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Flow App - Journal UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for interactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .draggable-widget { cursor: grab; }
        .draggable-widget:active { cursor: grabbing; }
        .dragging { opacity: 0.4; border: 2px dashed #E5A93B; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#EFECE6] flex items-center justify-center min-h-screen p-4">

    <!-- Mobile App Container (Frame, status bar time, 5G, and battery removed) -->
    <div class="w-[390px] h-[844px] bg-[#F7F5F0] rounded-[48px] shadow-2xl overflow-hidden flex flex-col relative" 
         x-data="financeApp()">

        <!-- Top Greeting Header with Editable Name & Male/Female Profile Selection -->
        <div class="flex items-center justify-between px-6 pt-6 pb-3">
            <div class="flex items-center space-x-3">
                <!-- History Drawer Toggle Button -->
                <button @click="historyOpen = !historyOpen" class="w-10 h-10 rounded-full bg-[#EFECE6] border border-stone-200 flex items-center justify-center text-[#2D1B2D] shadow-xs hover:bg-stone-200 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <div>
                    <p class="text-xs text-stone-400 font-medium" x-text="lang === 'en' ? 'Welcome back,' : '歡迎回來,'"></p>
                    <!-- Editable Name Field -->
                    <input type="text" x-model="userName" class="text-lg font-bold text-[#2D1B2D] bg-transparent border-b border-transparent hover:border-stone-300 focus:border-[#E5A93B] focus:outline-none w-36 transition">
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Language Switcher -->
                <button @click="lang = lang === 'en' ? 'zh' : 'en'" class="text-xs font-bold text-[#D95338] bg-orange-100/60 px-2.5 py-1.5 rounded-full border border-orange-200">
                    <span x-text="lang === 'en' ? 'EN' : '中'"></span>
                </button>
                <!-- Profile Icon with Male/Female/Neutral Selector -->
                <div class="relative" x-data="{ openSelector: false }">
                    <button @click="openSelector = !openSelector" class="w-10 h-10 rounded-full bg-amber-100 border border-amber-300 flex items-center justify-center text-xl shadow-xs hover:scale-105 transition">
                        <span x-text="selectedAvatar"></span>
                    </button>
                    <!-- Dropdown for Avatar selection -->
                    <div x-show="openSelector" @click.outside="openSelector = false" class="absolute right-0 mt-2 w-28 bg-white border border-stone-200 rounded-xl shadow-lg py-1 z-50 text-xs">
                        <button @click="selectedAvatar = '👨'; openSelector = false" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center space-x-2"><span>👨</span> <span x-text="lang === 'en' ? 'Male' : '男'"></span></button>
                        <button @click="selectedAvatar = '👩'; openSelector = false" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center space-x-2"><span>👩</span> <span x-text="lang === 'en' ? 'Female' : '女'"></span></button>
                        <button @click="selectedAvatar = '🧑'; openSelector = false" class="w-full text-left px-3 py-1.5 hover:bg-amber-50 flex items-center space-x-2"><span>🧑</span> <span x-text="lang === 'en' ? 'Neutral' : '中性'"></span></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Horizontal Date Pill Selector Bar (Auto-generated to present current week) -->
        <div class="px-6 pb-3">
            <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                <template x-for="day in dateStrip" :key="day.dateStr">
                    <div @click="selectedYear = day.year; selectedMonth = day.month; selectedDayStr = day.dateStr" 
                         :class="(selectedDayStr === day.dateStr) ? 'bg-[#E5A93B] text-white shadow-md' : 'bg-white text-stone-600 border border-stone-200'"
                         class="flex flex-col items-center justify-center min-w-[44px] h-[64px] rounded-2xl cursor-pointer transition">
                        <span class="text-[10px] font-medium opacity-80" x-text="day.dayName"></span>
                        <span class="text-sm font-bold mt-0.5" x-text="day.dayNum"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Left Sidebar / Slide-over Drawer for Yearly & Monthly History Review -->
        <div x-show="historyOpen" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="-translate-x-full" 
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="translate-x-0" 
             x-transition:leave-end="-translate-x-full"
             class="absolute inset-y-0 left-0 w-72 bg-[#F7F5F0] border-r border-stone-200 shadow-2xl z-50 flex flex-col pt-3 pb-20">
            
            <!-- Drawer Header -->
            <div class="px-4 py-3 border-b border-stone-200 flex justify-between items-center bg-white/60">
                <div class="flex items-center space-x-1.5">
                    <svg class="w-4 h-4 text-[#E5A93B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <h3 class="text-xs font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'History Archive (Year/Month)' : '歷史記錄歸檔 (年/月)'"></h3>
                </div>
                <button @click="historyOpen = false" class="text-stone-400 hover:text-stone-700 font-bold text-sm px-1.5">✕</button>
            </div>

            <!-- Drawer Content: Grouped by Year and Month -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <template x-for="yearGroup in availableYears()" :key="yearGroup.year">
                    <div class="space-y-2">
                        <!-- Year Title -->
                        <div class="bg-[#2D1B2D] text-white px-3 py-1.5 rounded-xl text-xs font-bold flex justify-between items-center shadow-xs">
                            <span x-text="yearGroup.year"></span>
                            <span class="text-[10px] text-amber-300" x-text="yearGroup.totalCount + (lang === 'en' ? ' records' : ' 筆記錄')"></span>
                        </div>

                        <!-- Months under this Year -->
                        <div class="pl-2 space-y-2">
                            <template x-for="monthGroup in yearGroup.months" :key="monthGroup.month">
                                <div class="bg-white border border-stone-200 rounded-2xl p-3 shadow-2xs space-y-2">
                                    <!-- Month Header with Quick Filter Switcher -->
                                    <div class="flex justify-between items-center cursor-pointer border-b border-stone-100 pb-1.5"
                                         @click="selectedYear = yearGroup.year; selectedMonth = monthGroup.month; historyOpen = false;">
                                        <span class="text-xs font-bold text-[#E5A93B]" x-text="getMonthName(monthGroup.month)"></span>
                                        <span class="text-[10px] bg-amber-50 text-amber-800 px-2 py-0.5 rounded-full font-bold" x-text="formatCurrency(monthGroup.totalAmount)"></span>
                                    </div>

                                    <!-- Record items list -->
                                    <div class="space-y-1">
                                        <template x-for="record in monthGroup.records">
                                            <div class="flex justify-between items-center text-[10px] text-stone-600 bg-stone-50 p-1.5 rounded-xl">
                                                <div>
                                                    <span class="font-semibold text-[#2D1B2D]" x-text="record.title"></span>
                                                    <span class="text-stone-400 text-[9px] block" x-text="record.date"></span>
                                                </div>
                                                <span class="font-bold text-[#E5A93B]" x-text="formatCurrency(record.amount)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <div x-show="availableYears().length === 0" class="text-center text-xs text-stone-400 py-6" x-text="lang === 'en' ? 'No history records found.' : '找不到歷史記錄。'"></div>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto px-6 pb-28 space-y-4 pt-1">
            
            <!-- ================= DASHBOARD TAB ================= -->
            <div x-show="activeTab === 'dashboard'" class="space-y-4" id="dashboard-container">
                
                <!-- Filter Status Banner -->
                <div class="flex justify-between items-center bg-white px-4 py-2.5 rounded-2xl border border-stone-200 shadow-2xs text-xs font-semibold text-stone-600">
                    <span>Filter: <strong class="text-[#2D1B2D]" x-text="selectedYear + ' / ' + (selectedMonth === 'All' ? 'All Months' : selectedMonth)"></strong></span>
                    <button @click="selectedYear='2026'; selectedMonth='10'" class="text-[#E5A93B] hover:underline text-[11px]" x-text="lang === 'en' ? 'Reset' : '重設'"></button>
                </div>

                <!-- Widget 1: Main Balance & Net Worth Card -->
                <div class="draggable-widget bg-gradient-to-br from-[#E5A93B] to-[#D95338] rounded-3xl p-5 text-white flex justify-between items-center shadow-lg shadow-amber-500/15" 
                     draggable="true" ondragstart="drag(event)" ondragover="allowDrop(event)" ondrop="drop(event)">
                    <div>
                        <p class="text-amber-100 text-xs font-medium mb-1" x-text="lang === 'en' ? 'Total Net Worth' : '總資產淨值'"></p>
                        <h2 class="text-3xl font-bold tracking-tight" x-text="formatCurrency(totalNetWorth())">$0.00</h2>
                        <p class="text-[10px] text-amber-100/80 mt-1" x-text="lang === 'en' ? 'Celebrate what made you smile today.' : '記錄您的每筆財務成長。'"></p>
                    </div>
                    <div class="bg-white/20 p-2.5 rounded-2xl cursor-grab">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16"></path></svg>
                    </div>
                </div>

                <!-- Widget 2: Asset Breakdown Donut Card -->
                <div class="draggable-widget bg-white p-5 rounded-3xl border border-stone-200 shadow-2xs space-y-3" 
                     draggable="true" ondragstart="drag(event)" ondragover="allowDrop(event)" ondrop="drop(event)">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-sm font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Asset Breakdown' : '資產分佈圖'"></h3>
                            <p class="text-[10px] text-stone-400" x-text="lang === 'en' ? 'Portfolio distribution overview' : '投資組合分佈概覽'"></p>
                        </div>
                        <span class="text-stone-300 text-xs font-bold">⠿</span>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <!-- SVG Donut Chart -->
                        <div class="relative w-32 h-32 flex items-center justify-center">
                            <svg class="w-32 h-32 transform -rotate-90" viewBox="0 0 36 36">
                                <template x-for="(slice, index) in assetSlices()">
                                    <circle cx="18" cy="18" r="15.9155" fill="none" 
                                            :stroke="slice.color" 
                                            stroke-width="5" 
                                            :stroke-dasharray="slice.dashArray" 
                                            :stroke-dashoffset="slice.dashOffset">
                                    </circle>
                                </template>
                            </svg>
                            <div class="absolute text-center">
                                <span class="text-[10px] text-stone-400 font-semibold block" x-text="lang === 'en' ? 'TOTAL' : '總計'"></span>
                                <span class="text-xs font-bold text-[#2D1B2D]" x-text="formatCurrency(totalNetWorth()).split('.')[0]"></span>
                            </div>
                        </div>

                        <!-- Legend -->
                        <div class="space-y-2 flex-1 pl-4">
                            <div class="flex items-center justify-between text-xs">
                                <span class="flex items-center text-stone-600"><span class="w-2.5 h-2.5 bg-[#E5A93B] rounded-full mr-2"></span> <span x-text="lang === 'en' ? 'Bank' : '銀行戶口'"></span></span>
                                <span class="font-bold text-[#2D1B2D]" x-text="calcPercent(totalBankBalance()) + '%'"></span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span class="flex items-center text-stone-600"><span class="w-2.5 h-2.5 bg-[#734238] rounded-full mr-2"></span> <span x-text="lang === 'en' ? 'Invest' : '投資'"></span></span>
                                <span class="font-bold text-[#2D1B2D]" x-text="calcPercent(totalInvestments()) + '%'"></span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span class="flex items-center text-stone-600"><span class="w-2.5 h-2.5 bg-[#6B8E23] rounded-full mr-2"></span> <span x-text="lang === 'en' ? 'Foreign' : '外幣'"></span></span>
                                <span class="font-bold text-[#2D1B2D]" x-text="calcPercent(totalForeignValue()) + '%'"></span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span class="flex items-center text-stone-600"><span class="w-2.5 h-2.5 bg-[#606C78] rounded-full mr-2"></span> <span x-text="lang === 'en' ? 'Insurance' : '保險'"></span></span>
                                <span class="font-bold text-[#2D1B2D]" x-text="calcPercent(totalInsurance()) + '%'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Widget 3: Income & Expenses Grid -->
                <div class="draggable-widget grid grid-cols-2 gap-3" 
                     draggable="true" ondragstart="drag(event)" ondragover="allowDrop(event)" ondrop="drop(event)">
                    <div class="bg-white p-4 rounded-3xl border border-stone-200 shadow-2xs">
                        <span class="text-[11px] font-semibold text-stone-400" x-text="lang === 'en' ? 'Total Income' : '總收入'"></span>
                        <input type="number" x-model.number="totalIncome" class="w-full text-base font-bold text-[#2D1B2D] mt-1 bg-amber-50/50 p-2 rounded-xl border border-amber-200/60">
                    </div>

                    <div class="bg-[#2D1B2D] p-4 rounded-3xl shadow-2xs text-white">
                        <span class="text-[11px] font-semibold text-stone-300" x-text="lang === 'en' ? 'Total Expenses' : '總支出'"></span>
                        <input type="number" x-model.number="totalExpenses" class="w-full text-base font-bold text-white mt-1 bg-[#3D263D] p-2 rounded-xl border border-stone-700">
                    </div>
                </div>

                <!-- Widget 4: Family Expense Card -->
                <div class="draggable-widget bg-white p-4 rounded-3xl border border-stone-200 shadow-2xs flex items-center justify-between" 
                     draggable="true" ondragstart="drag(event)" ondragover="allowDrop(event)" ondrop="drop(event)">
                    <div class="flex-1 mr-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-semibold text-stone-400" x-text="lang === 'en' ? 'Total Expense on Family' : '家庭總開支'"></span>
                            <span class="text-stone-300 text-xs font-bold">⠿</span>
                        </div>
                        <input type="number" x-model.number="familyExpense" class="w-full text-lg font-bold text-[#2D1B2D] mt-1 bg-stone-50 p-2 rounded-xl border border-stone-200">
                        <span class="text-[10px] text-amber-700 font-medium" x-text="lang === 'en' ? 'Childcare, groceries, utilities' : '育兒、日用品、家庭開支'"></span>
                    </div>
                    <div class="bg-amber-100/60 p-3 rounded-2xl text-[#E5A93B]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- ================= ACCOUNTS TAB ================= -->
            <div x-show="activeTab === 'accounts'" class="space-y-3" style="display: none;">
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-base font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Bank Account Balances' : '銀行戶口結餘'"></h3>
                    <span class="text-xs text-stone-400" x-text="filteredAccounts().length + (lang === 'en' ? ' Shown' : ' 個顯示')"></span>
                </div>

                <template x-for="(acc, index) in filteredAccounts()" :key="index">
                    <div class="bg-white text-[#2D1B2D] border border-stone-200 p-4 rounded-2xl flex justify-between items-center shadow-2xs">
                        <div>
                            <p class="text-[11px] text-stone-400 font-medium" x-text="acc.name + ' (' + acc.date + ')'"></p>
                            <p class="text-base font-bold" x-text="formatCurrency(acc.balance)"></p>
                        </div>
                        <button @click="deleteAccount(acc)" class="text-rose-400 hover:text-rose-600 p-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </template>

                <div class="bg-white p-4 rounded-2xl border border-dashed border-stone-300 space-y-2.5 mt-2">
                    <p class="text-xs font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Add New Bank Account Entry' : '新增銀行戶口記錄'"></p>
                    <input type="text" x-model="newAccName" :placeholder="lang === 'en' ? 'Account Name' : '戶口名稱'" class="w-full text-xs p-2.5 rounded-xl border border-stone-200 bg-stone-50">
                    <input type="number" x-model="newAccBalance" :placeholder="lang === 'en' ? 'Balance ($)' : '結餘 ($)'" class="w-full text-xs p-2.5 rounded-xl border border-stone-200 bg-stone-50">
                    <div class="flex items-center space-x-2">
                        <span class="text-[11px] text-stone-400 font-medium" x-text="lang === 'en' ? 'Saving Date:' : '記錄日期：'"></span>
                        <input type="date" x-model="newAccDate" class="flex-1 text-xs p-2 rounded-xl border border-stone-200 bg-stone-50">
                    </div>
                    <button @click="addAccount()" class="w-full bg-[#E5A93B] text-white text-xs font-semibold py-2.5 rounded-xl shadow-md" x-text="lang === 'en' ? 'Add Account' : '新增戶口'"></button>
                </div>
            </div>

            <!-- ================= INVESTMENTS TAB ================= -->
            <div x-show="activeTab === 'investments'" class="space-y-4" style="display: none;">
                <h3 class="text-base font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Investments & Assets' : '投資與資產'"></h3>

                <template x-for="(inv, index) in filteredInvestments()" :key="index">
                    <div class="bg-white p-4 rounded-2xl border border-stone-200 flex justify-between items-center shadow-2xs">
                        <div>
                            <span class="text-xs font-semibold text-stone-600" x-text="inv.category + ' (' + inv.date + ')'"></span>
                            <p class="text-sm font-bold text-[#E5A93B]" x-text="formatCurrency(inv.amount)"></p>
                        </div>
                        <button @click="deleteInvestment(inv)" class="text-rose-400 text-xs" x-text="lang === 'en' ? 'Remove' : '刪除'"></button>
                    </div>
                </template>

                <div class="bg-white p-4 rounded-2xl border border-dashed border-stone-300 space-y-2.5">
                    <p class="text-xs font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Add Investment / Interest' : '新增投資 / 利息'"></p>
                    <select x-model="newInvCategory" class="w-full text-xs p-2.5 rounded-xl border border-stone-200 bg-stone-50">
                        <option value="Time-Deposit" x-text="lang === 'en' ? 'Time-Deposit' : '定期存款'"></option>
                        <option value="Stocks" x-text="lang === 'en' ? 'Stocks' : '股票'"></option>
                        <option value="Bonds" x-text="lang === 'en' ? 'Bonds' : '債券'"></option>
                        <option value="Interest Earned" x-text="lang === 'en' ? 'Interest Earned' : '已收利息'"></option>
                        <option value="Others" x-text="lang === 'en' ? 'Others' : '其他'"></option>
                    </select>
                    <input type="number" x-model="newInvAmount" :placeholder="lang === 'en' ? 'Amount ($)' : '金額 ($)'" class="w-full text-xs p-2.5 rounded-xl border border-stone-200 bg-stone-50">
                    <div class="flex items-center space-x-2">
                        <span class="text-[11px] text-stone-400 font-medium" x-text="lang === 'en' ? 'Saving Date:' : '記錄日期：'"></span>
                        <input type="date" x-model="newInvDate" class="flex-1 text-xs p-2 rounded-xl border border-stone-200 bg-stone-50">
                    </div>
                    <button @click="addInvestment()" class="w-full bg-[#E5A93B] text-white text-xs font-semibold py-2.5 rounded-xl shadow-md" x-text="lang === 'en' ? 'Add Item' : '新增項目'"></button>
                </div>

                <div class="pt-2 border-t border-stone-200">
                    <h4 class="text-sm font-bold text-[#2D1B2D] mb-2" x-text="lang === 'en' ? 'Foreign Money Holdings' : '外幣持倉'"></h4>
                    <template x-for="(fx, index) in filteredForeignCurrencies()" :key="index">
                        <div class="bg-white p-4 rounded-2xl border border-stone-200 flex justify-between items-center mb-2 shadow-2xs">
                            <div>
                                <span class="text-xs font-semibold text-stone-600" x-text="fx.currency + ' (' + fx.code + ') - ' + fx.date"></span>
                                <p class="text-sm font-bold text-[#E5A93B]" x-text="fx.amount.toLocaleString() + ' ' + fx.code"></p>
                            </div>
                            <button @click="deleteFx(fx)" class="text-rose-400 text-xs" x-text="lang === 'en' ? 'Remove' : '刪除'"></button>
                        </div>
                    </template>

                    <div class="bg-white p-4 rounded-2xl border border-dashed border-stone-300 space-y-2.5">
                        <p class="text-xs font-bold text-[#2D1B2D]" x-text="lang === 'en' ? 'Add Foreign Currency' : '新增外幣'"></p>
                        <select x-model="newFxCode" class="w-full text-xs p-2.5 rounded-xl border border-stone-200 bg-stone-50">
                            <option value="JPY">JPY (日圓 / Japanese Yen)</option>

    <!-- Drag and Drop Support Script -->
    <script>
        let draggedElement = null;

        function drag(event) {
            draggedElement = event.target.closest('.draggable-widget');
            event.dataTransfer.effectAllowed = 'move';
            draggedElement.classList.add('dragging');
        }

        function allowDrop(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }

        function drop(event) {
            event.preventDefault();
            const targetWidget = event.target.closest('.draggable-widget');
            
            if (draggedElement && targetWidget && draggedElement !== targetWidget) {
                const container = document.getElementById('dashboard-container');
                const allWidgets = Array.from(container.querySelectorAll('.draggable-widget'));
                const draggedIndex = allWidgets.indexOf(draggedElement);
                const targetIndex = allWidgets.indexOf(targetWidget);

                if (draggedIndex < targetIndex) {
                    container.insertBefore(draggedElement, targetWidget.nextSibling);
                } else {
                    container.insertBefore(draggedElement, targetWidget);
                }
            }
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
        }

        document.addEventListener('dragend', (event) => {
            const widget = event.target.closest('.draggable-widget');
            if (widget) widget.classList.remove('dragging');
        });
    </script>

    <!-- JavaScript Controller -->
    <script>
        function financeApp() {
            let today = new Date();
            let dateStripArr = [];
            let currentDayOfWeek = today.getDay(); 
            let mondayOffset = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            
            let monday = new Date(today);
            monday.setDate(today.getDate() + mondayOffset);

            for (let i = 0; i < 7; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                
                let y = d.getFullYear().toString();
                let m = String(d.getMonth() + 1).padStart(2, '0');
                let dayNum = String(d.getDate());
                let dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                let dayName = dayNames[d.getDay()];
                let dateStr = `${y}-${m}-${String(d.getDate()).padStart(2, '0')}`;

                dateStripArr.push({ dayName, dayNum, year: y, month: m, dateStr });
            }

            let currentYearStr = today.getFullYear().toString();
            let currentMonthStr = String(today.getMonth() + 1).padStart(2, '0');
            let todayDateStr = `${currentYearStr}-${currentMonthStr}-${String(today.getDate()).padStart(2, '0')}`;

            let years = [];
            for (let y = 2016; y <= 2096; y++) { years.push(y); }

            return {
                activeTab: 'dashboard',
                lang: 'en', 
                userName: 'Jose Maria',
                selectedAvatar: '👨',
                
                selectedMonth: currentMonthStr,
                selectedYear: currentYearStr,
                selectedDayStr: todayDateStr,
                yearsRange: years,
                historyOpen: false,
                
                dateStrip: dateStripArr,

                totalIncome: 4850.00,
                totalExpenses: 1890.50,
                familyExpense: 1240.00,

                accounts: [
                    { name: 'HSBC Checking', balance: 18450, date: todayDateStr },
                    { name: 'BOC Emergency Savings', balance: 12000, date: '2026-10-10' },
                    { name: 'Hang Seng Joint Family', balance: 6350, date: '2026-09-20' }
                ],
                newAccName: '', newAccBalance: '', newAccDate: todayDateStr,

                investments: [
                    { category: 'Time-Deposit', amount: 15000, date: todayDateStr },
                    { category: 'Stocks', amount: 14200, date: '2026-10-12' }
                ],
                newInvCategory: 'Stocks', newInvAmount: '', newInvDate: todayDateStr,

                foreignCurrencies: [
                    { currency: 'Japanese Yen', code: 'JPY', amount: 150000, date: todayDateStr }
                ],
                newFxCode: 'JPY', newFxAmount: '', newFxDate: todayDateStr,

                insurances: [
                    { category: 'MPF', amount: 22100, currency: 'HKD', date: todayDateStr }
                ],
                newInsCategory: 'Saving Plan', newInsAmount: '', newInsCurrency: 'HKD', newInsDate: todayDateStr,

                matchesFilter(dateStr) {
                    if (!dateStr) return true;
                    const [year, month] = dateStr.split('-');
                    return (this.selectedYear === 'All' || year === this.selectedYear) && 
                           (this.selectedMonth === 'All' || month === this.selectedMonth);
                },

                filteredAccounts() { 
                    return this.accounts
                        .filter(i => this.matchesFilter(i.date))
                        .sort((a, b) => Number(a.balance) - Number(b.balance)); 
                },
                filteredInvestments() { 
                    return this.investments
                        .filter(i => this.matchesFilter(i.date))
                        .sort((a, b) => Number(a.amount) - Number(b.amount)); 
                },
                filteredForeignCurrencies() { 
                    return this.foreignCurrencies
                        .filter(i => this.matchesFilter(i.date))
                        .sort((a, b) => Number(a.amount) - Number(b.amount)); 
                },
                filteredInsurances() { 
                    return this.insurances
                        .filter(i => this.matchesFilter(i.date))
                        .sort((a, b) => Number(a.amount) - Number(b.amount)); 
                },

                availableYears() {
                    let allRecords = [];
                    this.accounts.forEach(a => allRecords.push({ title: a.name, amount: Number(a.balance), date: a.date }));
                    this.investments.forEach(i => allRecords.push({ title: i.category, amount: Number(i.amount), date: i.date }));
                    this.insurances.forEach(ins => allRecords.push({ title: ins.category + ' (' + ins.currency + ')', amount: this.getInsBaseAmount(ins), date: ins.date }));
                    this.foreignCurrencies.forEach(f => {
                        const rates = { JPY: 0.0065, RMB: 0.14, EUR: 1.08, GBP: 1.28, AUD: 0.65, USD: 1.0 };
                        allRecords.push({ title: f.code + ' Holding', amount: Number(f.amount) * (rates[f.code] || 1), date: f.date });
                    });

                    allRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

                    let yearsMap = {};
                    allRecords.forEach(rec => {
                        if(!rec.date) return;
                        let [y, m] = rec.date.split('-');
                        if(!y || !m) return;

                        if(!yearsMap[y]) { yearsMap[y] = { year: y, totalCount: 0, monthsMap: {} }; }
                        yearsMap[y].totalCount++;

                        if(!yearsMap[y].monthsMap[m]) {
                            yearsMap[y].monthsMap[m] = { month: m, totalAmount: 0, records: [] };
                        }
                        yearsMap[y].monthsMap[m].totalAmount += rec.amount;
                        yearsMap[y].monthsMap[m].records.push(rec);
                    });

                    let result = [];
                    Object.keys(yearsMap).sort((a,b) => b - a).forEach(y => {
                        let monthsArr = [];
                        Object.keys(yearsMap[y].monthsMap).sort((a,b) => b - a).forEach(m => {
                            monthsArr.push(yearsMap[y].monthsMap[m]);
                        });
                        result.push({ year: y, totalCount: yearsMap[y].totalCount, months: monthsArr });
                    });

                    return result;
                },

                getMonthName(m) {
                    const monthsEn = { '01':'January', '02':'February', '03':'March', '04':'April', '05':'May', '06':'June', '07':'July', '08':'August', '09':'September', '10':'October', '11':'November', '12':'December' };
                    const monthsZh = { '01':'一月', '02':'二月', '03':'三月', '04':'四月', '05':'五月', '06':'六月', '07':'七月', '08':'八月', '09':'九月', '10':'十月', '11':'十一月', '12':'十二月' };
                    return this.lang === 'en' ? (monthsEn[m] || m) : (monthsZh[m] || m);
                },

                getInsBaseAmount(ins) {
                    const rates = { HKD: 1.0, USD: 7.8, EUR: 8.5, GBP: 10.0, CNY: 1.1, JPY: 0.05 };
                    return Number(ins.amount) * (rates[ins.currency] || 1.0);
                },

                totalBankBalance() { return this.filteredAccounts().reduce((s, a) => s + Number(a.balance), 0); },
                totalInvestments() { return this.filteredInvestments().reduce((s, i) => s + Number(i.amount), 0); },
                totalForeignValue() { 
                    const rates = { JPY: 0.0065, RMB: 0.14, EUR: 1.08, GBP: 1.28, AUD: 0.65, USD: 1.0 };
                    return this.filteredForeignCurrencies().reduce((s, f) => s + (Number(f.amount) * (rates[f.code] || 1)), 0); 
                },
                totalInsurance() { return this.filteredInsurances().reduce((s, ins) => s + this.getInsBaseAmount(ins), 0); },
                
                totalNetWorth() {
                    return this.totalBankBalance() + this.totalInvestments() + this.totalForeignValue() + this.totalInsurance();
                },

                calcPercent(val) {
                    let total = this.totalNetWorth();
                    if (total === 0) return 0;
                    return Math.round((val / total) * 100);
                },

                assetSlices() {
                    let total = this.totalNetWorth();
                    if (total === 0) return [];
                    
                    let data = [
                        { val: this.totalBankBalance(), color: '#E5A93B' },
                        { val: this.totalInvestments(), color: '#734238' },
                        { val: this.totalForeignValue(), color: '#6B8E23' },
                        { val: this.totalInsurance(), color: '#606C78' }
                    ];

                    let accumulatedPercent = 0;
                    return data.map(item => {
                        let pct = (item.val / total) * 100;
                        let dashArray = `${pct} ${100 - pct}`;
                        let dashOffset = -accumulatedPercent;
                        accumulatedPercent += pct;
                        return { color: item.color, dashArray: `${dashArray}`, dashOffset: `${dashOffset}` };
                    });
                },

                addAccount() {
                    if(this.newAccName && this.newAccBalance) {
                        this.accounts.push({ name: this.newAccName, balance: Number(this.newAccBalance), date: this.newAccDate });
                        this.newAccName = ''; this.newAccBalance = '';
                    }
                },
                deleteAccount(item) { this.accounts = this.accounts.filter(i => i !== item); },

                addInvestment() {
                    if(this.newInvAmount) {
                        this.investments.push({ category: this.newInvCategory, amount: Number(this.newInvAmount), date: this.newInvDate });
                        this.newInvAmount = '';
                    }
                },
                deleteInvestment(item) { this.investments = this.investments.filter(i => i !== item); },

                addForeignCurrency() {
                    if(this.newFxAmount) {
                        const names = { JPY: 'Japanese Yen', RMB: 'Chinese Yuan', EUR: 'Euro', GBP: 'British Pound', AUD: 'Australian Dollar', USD: 'US Dollar' };
                        this.foreignCurrencies.push({ currency: names[this.newFxCode], code: this.newFxCode, amount: Number(this.newFxAmount), date: this.newFxDate });
                        this.newFxAmount = '';
                    }
                },
                deleteFx(item) { this.foreignCurrencies = this.foreignCurrencies.filter(i => i !== item); },

                addInsurance() {
                    if(this.newInsAmount) {
                        this.insurances.push({ category: this.newInsCategory, amount: Number(this.newInsAmount), currency: this.newInsCurrency, date: this.newInsDate });
                        this.newInsAmount = '';
                    }
                },
                deleteInsurance(item) { this.insurances = this.insurances.filter(i => i !== item); },

                formatCurrency(value) {
                    return '$' + Number(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                }
            }
        }
    </script>
